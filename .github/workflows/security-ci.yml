name: Security & Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  static-and-unit-security:
    name: Lint, Typecheck, Security Tests & SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run security:check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  container-vulnerability-scan:
    name: Docker Image Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: static-and-unit-security
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: factual-web:ci
      - uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "factual-web:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
