services:
  postgres:
    image: postgres:16-alpine
    container_name: factual-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment before starting}
      POSTGRES_DB: ${POSTGRES_DB:-factual_techno}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - factual_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factual} -d ${POSTGRES_DB:-factual_techno}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factual_pg_data:
